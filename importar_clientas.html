async function startImport() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('progress').style.display = 'block';
  const total = CLIENTS.length;
  const batchSize = 50;
  let done = 0;
  const log = document.getElementById('log');

  for (let i = 0; i < total; i += batchSize) {
    const batch = CLIENTS.slice(i, i + batchSize);
    try {
      const res = await fetch(SB_URL + '/rest/v1/clientas', {
        method: 'POST',
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal,resolution=ignore-duplicates'
        },
        body: JSON.stringify(batch)
      });
      if (res.ok || res.status === 201 || res.status === 204) {
        done += batch.length;
        log.innerHTML += '✓ ' + batch.length + ' clientas subidas<br>';
      } else {
        const err = await res.text();
        log.innerHTML += '✗ Error en lote: ' + err.slice(0,100) + '<br>';
      }
    } catch(e) {
      log.innerHTML += '✗ Error de red: ' + e.message + '<br>';
    }
    log.scrollTop = log.scrollHeight;
    const pct = Math.round(done/total*100);
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('status').textContent = done + ' de ' + total + ' clientas importadas...';
  }

  document.getElementById('status').textContent = '¡Listo! ' + done + ' clientas importadas.';
  document.getElementById('success').style.display = 'block';
  btn.textContent = 'Importación completa ✓';
}
</script>
