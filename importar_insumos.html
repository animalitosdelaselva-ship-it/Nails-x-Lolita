const list=document.getElementById('list');let cur='';

    const cur=getS('nxl_insumos');
    localStorage.setItem('nxl_insumos_backup_'+Date.now(),JSON.stringify(cur));
    const nuevos=sel.map((it,n)=>({id:(Date.now()+n).toString(),nombre:it.nombre,categoria:it.categoria,marca:it.marca||null,tienda:null,url:null,stock:'',stockMin:'',notas:it.notas||null,precio:null,cantidad:null,costoPorClienta:null,porPeso:it.porPeso||'no',unidad:it.porPeso==='si'?'g':null,metodo:{}}));
    localStorage.setItem('nxl_insumos',JSON.stringify(cur.concat(nuevos)));
    document.getElementById('msg').textContent='✓ '+nuevos.length+' insumos cargados. Ya puedes abrir Insumos.';
    sel.forEach(s=>exist.add(key(s)));
    document.querySelectorAll('input[data-i]:checked').forEach(c=>{c.disabled=true;c.checked=false;c.closest('.row').classList.add('dup')});
  }catch(e){document.getElementById('msg').textContent='Error: '+e.message}
}
</script></body></html>
