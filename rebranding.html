let cur=0,saveT=null;
try{const c=parseInt(localStorage.getItem('nxl_rebranding_sec'));if(c>=0&&c<SECTIONS.length)cur=c;}catch(e){}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}const el=document.getElementById('saved');el.classList.add('show');clearTimeout(saveT);saveT=setTimeout(()=>el.classList.remove('show'),1200);updProgress();}
function setV(id,v){S[id]=v;save();}
function arr(id){if(!Array.isArray(S[id]))S[id]=[];return S[id];}
function obj(id){if(!S[id]||typeof S[id]!=='object'||Array.isArray(S[id]))S[id]={};return S[id];}

function filled(f){
  const v=S[f.id];
  switch(f.t){
    case 'list':return Array.isArray(v)&&v.some(x=>x&&x.trim());
    case 'chips':return Array.isArray(v)&&v.length>0;
    case 'sliders':return v&&Object.keys(v).length>0;
    case 'checklist':return v&&Object.values(v).some(Boolean);
    case 'status':return v&&Object.values(v).some(x=>x&&x.s&&x.s!=='Pendiente');
    case 'rows':case 'names':case 'colors':return Array.isArray(v)&&v.some(r=>Object.values(r).some(x=>x&&String(x).trim&&String(x).trim()!==''&&x!==false&&x!==3&&x!=='#c9a0a0'));
    case 'fonts':return v&&(v.h||v.b);
    case 'budget':return Array.isArray(v)&&v.some(r=>r.c>0);
    case 'timeline':return Array.isArray(v)&&v.some(r=>r.f||r.d);
    case 'preview':return false;
    default:return v!==undefined&&String(v).trim()!=='';
  }
}
function secProgress(s){const fs=s.fields.filter(f=>f.t!=='preview');if(!fs.length)return null;return fs.filter(filled).length/fs.length;}
function updProgress(){
  let tot=0,n=0;
  SECTIONS.forEach((s,i)=>{const p=secProgress(s);const el=document.getElementById('pct-'+i);if(p===null)return;tot+=p;n++;if(el){el.textContent=Math.round(p*100)+'%';el.className='pct'+(p>=1?' done':'');}});
  const t=n?Math.round(tot/n*100):0;document.getElementById('total-pct').textContent=t+'%';document.getElementById('total-bar').style.width=t+'%';
}

// ============ RENDER DE CAMPOS ============
function renderField(f){
  const v=S[f.id];let body='';
  switch(f.t){
    case 'text':body=`<input type="text" value="${esc(v)}" oninput="setV('${f.id}',this.value)">`;break;
    case 'number':body=`<input type="number" inputmode="numeric" value="${esc(v)}" oninput="setV('${f.id}',this.value)">`;break;
    case 'date':body=`<input type="date" value="${esc(v)}" onchange="setV('${f.id}',this.value)">`;break;
    case 'textarea':body=`<textarea oninput="setV('${f.id}',this.value)">${esc(v)}</textarea>`;break;
    case 'select':body=`<select onchange="setV('${f.id}',this.value)"><option value="">Elegir…</option>${f.opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case 'chips':{const sel=Array.isArray(v)?v:[];body=`<div class="chips">${f.opts.map(o=>`<span class="chip ${sel.includes(o)?'on':''}" onclick="chip('${f.id}','${esc(o)}',${f.max||0},this)">${esc(o)}</span>`).join('')}</div>${f.max>1?`<div class="hint" style="margin-top:6px" id="cnt-${f.id}">${sel.length} de ${f.max} elegidos</div>`:''}`;break;}
    case 'list':{const a=Array.isArray(v)&&v.length?v:[''];body=a.map((x,i)=>`<div class="row"><input type="text" value="${esc(x)}" placeholder="${esc(f.ph||'')}" oninput="listSet('${f.id}',${i},this.value)"><button class="btn x" onclick="listDel('${f.id}',${i})">✕</button></div>`).join('')+`<button class="btn sm" onclick="listAdd('${f.id}')">+ Añadir</button>`;break;}
    case 'sliders':{const o=v||{};body=PERS.map(([a,b])=>{const k=a+'|'+b,t=o[k]!==undefined;return `<div class="slider ${t?'':'untouched'}"><span>${a}</span><input type="range" min="1" max="5" step="1" value="${t?o[k]:3}" oninput="slide('${f.id}','${k}',this.value,this)"><span>${b}</span></div>`;}).join('');break;}
    case 'checklist':{const o=v||{};body=`<div class="checks">${f.items.map((it,i)=>`<label><input type="checkbox" ${o[i]?'checked':''} onchange="chk('${f.id}',${i},this.checked)"> <span>${esc(it)}</span></label>`).join('')}</div>`;break;}
    case 'status':{const o=v||{};body=`<div class="tp colhead"><span>Dónde</span><span>Estado</span><span>Notas</span></div>`+f.items.map((it,i)=>{const r=o[i]||{};return `<div class="tp"><span>${esc(it)}</span><select onchange="st('${f.id}',${i},'s',this.value)">${['Pendiente','En proceso','Listo','No aplica'].map(x=>`<option ${(r.s||'Pendiente')===x?'selected':''}>${x}</option>`).join('')}</select><input type="text" value="${esc(r.n||'')}" placeholder="Notas" oninput="st('${f.id}',${i},'n',this.value,true)"></div>`;}).join('');break;}
    case 'rows':{const a=arr(f.id);const g=`grid-template-columns:${f.cols.map(()=>'1fr').join(' ')} 40px`;body=`<div class="scroll"><div style="min-width:480px"><div class="grid-r colhead" style="${g}">${f.cols.map(c=>`<span>${c[1]}</span>`).join('')}<span></span></div>${a.map((r,i)=>`<div class="grid-r" style="${g}">${f.cols.map(c=>`<input type="text" value="${esc(r[c[0]])}" oninput="rowSet('${f.id}',${i},'${c[0]}',this.value)">`).join('')}<button class="btn x" onclick="rowDel('${f.id}',${i})">✕</button></div>`).join('')}</div></div><button class="btn sm" onclick="rowAdd('${f.id}')">${f.addLabel||'+ Añadir'}</button>`;break;}
    case 'names':{const a=arr(f.id);const best=a.length?Math.max(...a.map(nameScore)):0;const g='grid-template-columns:1.4fr 56px 56px 56px 56px 70px 60px 70px 40px';
      body=`<div class="scroll"><div style="min-width:640px"><div class="grid-r colhead" style="${g}"><span>Nombre</span><span>Fácil</span><span>@ libre</span><span>Dominio</span><span>Marca</span><span>Me gusta</span><span>Puntaje</span><span></span><span></span></div>`+a.map((r,i)=>`<div class="grid-r" style="${g}"><input type="text" value="${esc(r.n)}" onchange="rowSet('${f.id}',${i},'n',this.value,true)">${['p','h','d','m'].map(k=>`<input type="checkbox" style="justify-self:center" ${r[k]?'checked':''} onchange="rowSet('${f.id}',${i},'${k}',this.checked,true)">`).join('')}<select onchange="rowSet('${f.id}',${i},'g',+this.value,true)">${[1,2,3,4,5].map(n=>`<option ${(r.g||3)==n?'selected':''}>${n}</option>`).join('')}</select><b>${nameScore(r)}${best&&nameScore(r)===best&&a.length>1?' ⭐':''}</b><button class="btn sm" onclick="pickName(${i})">Elegir</button><button class="btn x" onclick="rowDel('${f.id}',${i},true)">✕</button></div>`).join('')+`</div></div><button class="btn sm" onclick="rowAdd('${f.id}',true,{g:3})">+ Añadir nombre</button>`;break;}
    case 'colors':{const a=arr(f.id);const ROL=['Principal','Secundario','Acento','Fondo','Texto'];
      body=a.map((r,i)=>{const cw=ratio(r.hex,'#ffffff'),cb=ratio(r.hex,'#000000');return `<div class="grid-r" style="grid-template-columns:48px 1fr 130px 1.4fr 40px"><input type="color" class="swatch" value="${esc(r.hex||'#c9a0a0')}" onchange="rowSet('${f.id}',${i},'hex',this.value,true)"><input type="text" placeholder="Nombre del color (ej: rosa polvo)" value="${esc(r.n)}" onchange="rowSet('${f.id}',${i},'n',this.value)"><select onchange="rowSet('${f.id}',${i},'rol',this.value,true)"><option value="">Rol…</option>${ROL.map(x=>`<option ${r.rol===x?'selected':''}>${x}</option>`).join('')}</select><span style="font-size:11px;color:#777">${esc(r.hex||'#c9a0a0')} · texto blanco ${cw.toFixed(1)}:1 ${cw>=4.5?'<span class="pill g">se lee</span>':'<span class="pill r">poco contraste</span>'} · texto negro ${cb.toFixed(1)}:1 ${cb>=4.5?'<span class="pill g">se lee</span>':'<span class="pill r">poco</span>'}</span><button class="btn x" onclick="rowDel('${f.id}',${i},true)">✕</button></div>`;}).join('')+`<button class="btn sm" onclick="rowAdd('${f.id}',true,{hex:'#c9a0a0'})">+ Añadir color</button>`;break;}
    case 'fonts':{const o=obj(f.id);body=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div class="hint">Títulos</div><input type="text" value="${esc(o.h||'')}" placeholder="Ej: Playfair Display" onchange="fontSet('h',this.value)"></div><div><div class="hint">Textos</div><input type="text" value="${esc(o.b||'')}" placeholder="Ej: Poppins" onchange="fontSet('b',this.value)"></div></div>`;break;}
    case 'preview':body=previewHtml();break;
    case 'budget':{const a=budgetRows();const tot=a.reduce((s,r)=>s+(+r.c||0),0);const pres=+S.presupuesto||0;
      body=`<div class="scroll"><div style="min-width:480px"><div class="grid-r colhead" style="grid-template-columns:1.6fr 1fr 1fr"><span>Concepto</span><span>Costo (Ft)</span><span>Quién</span></div>${a.map((r,i)=>`<div class="grid-r" style="grid-template-columns:1.6fr 1fr 1fr"><input type="text" value="${esc(r.n)}" oninput="bSet(${i},'n',this.value)"><input type="number" inputmode="numeric" value="${r.c||''}" onchange="bSet(${i},'c',this.value,true)"><select onchange="bSet(${i},'q',this.value)"><option ${r.q==='Yo'?'selected':''}>Yo</option><option ${r.q==='Contrato'?'selected':''}>Contrato</option></select></div>`).join('')}</div></div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:14px;font-weight:500"><span>Total estimado</span><span>${tot.toLocaleString('hu-HU')} Ft</span></div>${pres?`<div class="hint">${tot<=pres?'Dentro de tu presupuesto: te sobran '+(pres-tot).toLocaleString('hu-HU')+' Ft.':'Te pasas del presupuesto por '+(tot-pres).toLocaleString('hu-HU')+' Ft. Considera hacerlo por fases.'}</div>`:''}`;break;}
    case 'timeline':{const a=timelineRows();body=`<div class="grid-r colhead" style="grid-template-columns:1.6fr 1fr 70px"><span>Fase</span><span>Fecha objetivo</span><span>Hecho</span></div>`+a.map((r,i)=>`<div class="grid-r" style="grid-template-columns:1.6fr 1fr 70px"><span style="font-size:13px">${esc(r.f)}</span><input type="date" value="${esc(r.d||'')}" onchange="tSet(${i},'d',this.value)"><input type="checkbox" style="justify-self:center" ${r.x?'checked':''} onchange="tSet(${i},'x',this.checked,true)"></div>`).join('');break;}
  }
  return `<div class="field"><label class="l">${esc(f.l)}</label>${f.h?`<div class="hint">${esc(f.h)}</div>`:''}${body}</div>`;
}

// ============ HELPERS DE CAMPOS ============
function chip(id,o,max,el){const a=arr(id);const i=a.indexOf(o);
  if(i>=0){a.splice(i,1);el.classList.remove('on');}
  else{if(max===1){a.length=0;el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));}
    else if(max&&a.length>=max){return;}
    a.push(o);el.classList.add('on');}
  const c=document.getElementById('cnt-'+id);if(c)c.textContent=a.length+' de '+max+' elegidos';save();}
function listSet(id,i,v){const a=arr(id);while(a.length<=i)a.push('');a[i]=v;save();}
function listAdd(id){const a=arr(id);if(!a.length)a.push('');a.push('');save();render(false);}
function listDel(id,i){const a=arr(id);a.splice(i,1);save();render(false);}
function slide(id,k,v,el){obj(id)[k]=+v;el.parentNode.classList.remove('untouched');save();}
function chk(id,i,on){obj(id)[i]=on;save();}
function st(id,i,k,v,quiet){const o=obj(id);o[i]=o[i]||{};o[i][k]=v;save();if(k==='s')render(false);}
function rowAdd(id,rerender,def){arr(id).push(Object.assign({},def||{}));save();render(false);}
function rowDel(id,i){arr(id).splice(i,1);save();render(false);}
function rowSet(id,i,k,v,rerender){const a=arr(id);if(!a[i])return;a[i][k]=v;save();if(rerender)render(false);}
function nameScore(r){return ['p','h','d','m'].filter(k=>r[k]).length+(+r.g||3);}
function pickName(i){const r=arr('candidatos')[i];if(r&&r.n){S.nombreFinal=r.n;save();render(false);}}
function lum(hex){const h=(hex||'#c9a0a0').replace('#','');const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function loadFont(n){if(!n)return;const id='gf-'+n.replace(/\W/g,'');if(document.getElementById(id))return;const l=document.createElement('link');l.id=id;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(n).replace(/%20/g,'+')+':wght@400;600&display=swap';document.head.appendChild(l);}
function fontSet(k,v){obj('fuentes')[k]=v.trim();save();loadFont(v.trim());render(false);}
function colorBy(rol,def){const r=(S.paleta||[]).find(x=>x.rol===rol&&x.hex);return r?r.hex:def;}
function previewHtml(){
  const o=S.fuentes||{},name=S.nombreFinal||S.marcaActual||'Tu marca';loadFont(o.h);loadFont(o.b);
  const bg=colorBy('Fondo','#ffffff'),main=colorBy('Principal','#1a1a18'),acc=colorBy('Acento','#c9a0a0'),txt=colorBy('Texto','#1a1a18'),sec=colorBy('Secundario','#eee');
  const hf=o.h?`'${o.h}',serif`:'inherit',bf=o.b?`'${o.b}',sans-serif`:'inherit';
  const tag=(S.eslogan&&S.eslogan.find(x=>x&&x.trim()))||'Tu frase de marca aparecerá aquí';
  return `<div style="background:${bg};border:0.5px solid #ddd;border-radius:12px;padding:28px;color:${txt};font-family:${bf}"><div style="display:flex;gap:6px;margin-bottom:18px">${[main,sec,acc,bg,txt].map(c=>`<span style="width:22px;height:22px;border-radius:50%;background:${c};border:0.5px solid #ccc"></span>`).join('')}</div><div style="font-family:${hf};font-size:34px;line-height:1.1;color:${main}">${esc(name)}</div><div style="margin-top:8px;font-size:15px;opacity:.85">${esc(tag)}</div><div style="margin-top:16px;display:inline-block;padding:9px 20px;border-radius:24px;background:${acc};color:${lum(acc)>0.5?'#1a1a18':'#fff'};font-size:13px">Reservar cita</div></div><div class="hint" style="margin-top:6px">Usa tu nombre elegido, tus colores con rol y tus fuentes. Si no ves la fuente, revisa que el nombre esté bien escrito.</div>`;
}
function budgetRows(){if(!Array.isArray(S.costos)||!S.costos.length)S.costos=BUDGET_DEF.map(n=>({n,c:0,q:'Yo'}));return S.costos;}
function bSet(i,k,v,rr){const a=budgetRows();a[i][k]=k==='c'?(parseFloat(v)||0):v;save();if(rr)render(false);}
function timelineRows(){if(!Array.isArray(S.fases)||!S.fases.length)S.fases=PHASES.map(f=>({f,d:'',x:false}));return S.fases;}
function tSet(i,k,v,rr){const a=timelineRows();a[i][k]=v;save();}

// ============ BRIEF ============
function valText(f){
  const v=S[f.id];
  switch(f.t){
    case 'list':return (v||[]).filter(x=>x&&x.trim()).map(x=>'- '+x).join('\n');
    case 'chips':return (v||[]).join(', ');
    case 'sliders':return Object.entries(v||{}).map(([k,n])=>{const [a,b]=k.split('|');return `- ${a} ↔ ${b}: ${n}/5`;}).join('\n');
    case 'checklist':return f.items.map((it,i)=>`- [${(v||{})[i]?'x':' '}] ${it}`).join('\n');
    case 'status':return f.items.map((it,i)=>{const r=(v||{})[i]||{};return `- ${it}: ${r.s||'Pendiente'}${r.n?' ('+r.n+')':''}`;}).join('\n');
    case 'rows':return (v||[]).filter(r=>r.n).map(r=>'- '+f.cols.map(c=>r[c[0]]?`${c[1]}: ${r[c[0]]}`:'').filter(Boolean).join(' · ')).join('\n');
    case 'names':return (v||[]).filter(r=>r.n).sort((a,b)=>nameScore(b)-nameScore(a)).map(r=>`- ${r.n} (puntaje ${nameScore(r)}; fácil ${r.p?'sí':'no'}, @ libre ${r.h?'sí':'no'}, dominio ${r.d?'sí':'no'}, marca ${r.m?'sí':'no'}, me gusta ${r.g||3}/5)`).join('\n');
    case 'colors':return (v||[]).filter(r=>r.hex).map(r=>`- ${r.n||'Color'} ${r.hex}${r.rol?' ('+r.rol+')':''}`).join('\n');
    case 'fonts':return v?[v.h?'Títulos: '+v.h:'',v.b?'Textos: '+v.b:''].filter(Boolean).join('\n'):'';
    case 'budget':return budgetRows().filter(r=>r.c>0).map(r=>`- ${r.n}: ${(+r.c).toLocaleString('hu-HU')} Ft (${r.q})`).join('\n');
    case 'timeline':return timelineRows().map(r=>`- [${r.x?'x':' '}] ${r.f}${r.d?' — '+r.d:''}`).join('\n');
    case 'preview':return '';
    default:return v!==undefined&&String(v).trim()?String(v).trim():'';
  }
}
function buildBrief(){
  const nombre=S.nombreFinal||S.marcaActual||'Mi marca';
  let t=`# Brief de rebranding: ${nombre}\n`;
  if(S.marcaActual&&S.nombreFinal&&S.marcaActual!==S.nombreFinal)t+=`(antes: ${S.marcaActual})\n`;
  t+=`Estudio de uñas independiente · Budapest\n`;
  const miss=[];
  SECTIONS.forEach(s=>{if(s.special)return;let sec='';s.fields.forEach(f=>{const x=valText(f);if(x)sec+=`\n**${f.l}**\n${x}\n`;else if(f.t!=='preview')miss.push(s.title+': '+f.l);});if(sec)t+=`\n## ${s.title}\n${sec}`;});
  return {text:t,miss};
}
function copyBrief(){const t=document.getElementById('brief-text').value;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado ✓')).catch(()=>{const el=document.getElementById('brief-text');el.select();document.execCommand('copy');toast('Copiado ✓');});}
function dlBrief(){const b=new Blob([document.getElementById('brief-text').value],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='brief_rebranding.md';a.click();}
function toast(m){const e=document.getElementById('saved');e.textContent=m;e.classList.add('show');setTimeout(()=>{e.classList.remove('show');e.textContent='Guardado ✓';},1500);}
function nextStep(){for(let i=0;i<SECTIONS.length-1;i++){const p=secProgress(SECTIONS[i]);if(p!==null&&p<1)return i;}return -1;}

// ============ RENDER GENERAL ============
function renderSide(){
  document.getElementById('side').innerHTML=SECTIONS.map((s,i)=>`<button class="step ${i===cur?'active':''}" onclick="go(${i})"><span>${s.icon}</span><span>${s.title}</span><span class="pct" id="pct-${i}"></span></button>`).join('');
  updProgress();
}
function render(top){
  const y=window.scrollY,s=SECTIONS[cur];
  let h=`<h1>${s.icon} ${s.title}</h1><div class="why">${s.why}</div>`;
  if(s.special==='brief'){
    const b=buildBrief(),ns=nextStep();
    h+=(ns>=0?`<div class="noprint" style="background:#fef9e7;border:0.5px solid #f0d060;border-radius:8px;padding:10px 14px;font-size:13px;color:#7a5a00;margin-bottom:12px">Aún faltan respuestas. Siguiente paso recomendado: <a href="#" onclick="go(${ns});return false" style="color:#7a5a00;font-weight:500">${SECTIONS[ns].icon} ${SECTIONS[ns].title}</a>.</div>`:`<div class="noprint" style="background:#e6f4ee;border-radius:8px;padding:10px 14px;font-size:13px;color:#1a7a4a;margin-bottom:12px">Todas las secciones tienen respuestas. Revisa el brief y compártelo.</div>`)
      +`<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn dark" onclick="copyBrief()">Copiar</button><button class="btn" onclick="dlBrief()">Descargar (.md)</button><button class="btn" onclick="window.print()">Imprimir / PDF</button></div>`
      +`<textarea id="brief-text" class="noprint" style="min-height:360px;font-size:12px;font-family:ui-monospace,monospace" readonly>${esc(b.text)}</textarea>`
      +(b.miss.length?`<details class="noprint" style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:#666">Preguntas sin responder (${b.miss.length})</summary><ul style="font-size:12px;color:#777;margin:8px 0 0 18px;line-height:1.6">${b.miss.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></details>`:'');
  } else h+=s.fields.map(renderField).join('');
  h+=`<div class="nav-btns"><button class="btn" ${cur===0?'disabled style="opacity:.4"':''} onclick="go(${cur-1})">← Anterior</button>${cur<SECTIONS.length-1?`<button class="btn dark" onclick="go(${cur+1})">Siguiente →</button>`:''}</div>`;
  document.getElementById('main').innerHTML=h;
  renderSide();
  if(top)window.scrollTo(0,0);else window.scrollTo(0,y);
}
function go(i){if(i<0||i>=SECTIONS.length)return;cur=i;try{localStorage.setItem('nxl_rebranding_sec',i);}catch(e){}render(true);}
(function(){const o=S.fuentes||{};loadFont(o.h);loadFont(o.b);render(true);})();
</script>
